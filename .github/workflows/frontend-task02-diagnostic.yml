name: Frontend Task 02 Diagnostic CI

on:
  pull_request:
    branches:
      - frontend/task-01-auth-courses-import

jobs:
  frontend-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
